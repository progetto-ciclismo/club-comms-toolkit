name: Verifica adapter

# Gli adapter in adapters/ sono generati da core/ e templates/.
# Questa verifica impedisce che tornino a divergere dal sorgente.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adapter allineati al sorgente
        run: ./build.sh --check
      - name: Esempi conformi alle regole meccaniche
        run: python3 scripts/verifica_testo.py examples/sample-output-*.md
